<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar — Duck Studios</title>
<link rel="icon" href="/static/logo/marca-cor.svg">
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:var(--ds-e-5)}
  .cartao{width:100%;max-width:400px}
  .logo{display:block;width:180px;margin:0 auto var(--ds-e-6)}
  h1{font-size:1.375rem;font-weight:500;margin:0 0 var(--ds-e-5);text-align:center}
  label{display:block;font-size:.8125rem;color:var(--ds-txt-2);margin:var(--ds-e-4) 0 6px}
  .ds-campo{width:100%}
  .ds-btn{width:100%;margin-top:var(--ds-e-5)}
  .erro{background:var(--ds-erro-bg);color:var(--ds-erro);border-radius:14px;
        padding:10px 14px;font-size:.8125rem;margin-bottom:var(--ds-e-4)}
  .pe{margin-top:var(--ds-e-5);text-align:center;font-size:.75rem;color:var(--ds-txt-3);
      line-height:1.7}
</style></head><body>
<div class="cartao">
  <img class="logo" src="/static/logo/logo-horizontal-branco.svg" alt="Duck Studios">
  <section class="ds-card ds-card--alto">
    <h1>Entrar no CRM</h1>
    {% if erro %}<div class="erro">E-mail ou senha não conferem.</div>{% endif %}
    <form method="post" action="/login">
      <label>E-mail</label>
      <input class="ds-campo" type="email" name="email" required autofocus
             autocomplete="username">
      <label>Senha</label>
      <input class="ds-campo" type="password" name="senha" required
             autocomplete="current-password">
      <button class="ds-btn">Entrar</button>
    </form>
  </section>
  <div class="pe">Sem acesso? Peça um convite a quem administra o CRM.<br>
    Esqueceu a senha? O administrador gera um novo link em Usuários.</div>
</div>
</body></html>
